<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Временный сбой — Megador</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #F8F9FA;
    color: #1E293B;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 640px;
    width: 100%;
    text-align: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    margin-bottom: 24px;
    border-radius: 999px;
    background: #FFF5F0;
    border: 1px solid rgba(230, 95, 43, 0.3);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #E65F2B;
  }
  .badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #E65F2B;
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  svg { width: 100%; height: auto; max-width: 420px; margin: 0 auto 24px; display: block; }
  h1 {
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 800;
    color: #2F3E46;
    margin-bottom: 12px;
    line-height: 1.2;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: #64748B;
    max-width: 480px;
    margin: 0 auto 28px;
  }
  .actions { margin-bottom: 28px; }
  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #E65F2B;
    color: #fff;
    transition: background 0.2s;
  }
  button:hover { background: #D45425; }
  .phones {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 24px;
  }
  .phones a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #2F3E46;
    text-decoration: none;
  }
  .phones a:hover { color: #E65F2B; }
  .phones svg { width: 16px; height: 16px; }
</style>
</head>

  <div class="badge"><span class="dot"></span>Временный сбой</div>
